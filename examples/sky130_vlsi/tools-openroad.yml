# Open-source tool setup: Yosys for synthesis, in place of Genus.
#
# synthesis.yosys.version is a dummy value in the plugin's own defaults (the
# real version is probed from the binary by OpenROADTool) and
# openroad.extra_env_vars defaults to [] in hammer/common/openroad, so the
# binary path is the only setting this flow has to supply.
vlsi.core.synthesis_tool: "hammer.synthesis.yosys"

# Filled in by Sky130OpenSynNode from the yosys_bin input.
synthesis.yosys.yosys_bin: "/path/to/yosys"
